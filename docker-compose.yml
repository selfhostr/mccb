services:
  web:
    build: .
    image: psttoimap:latest
    command: ["python", "-m", "app.server.web"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    ports:
      - "22362:22362"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:22362/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: psttoimap:latest
    depends_on:
      - web
    command: ["python", "-m", "app.server.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "app.server.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
